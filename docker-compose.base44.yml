name: studyling

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: studyling
      POSTGRES_PASSWORD: studyling
      POSTGRES_DB: studyling
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyling -d studyling"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    image: node:22
    restart: on-failure
    working_dir: /repo/server
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec node --watch src/index.js"]
    environment:
      DATABASE_URL: postgres://studyling:studyling@db:5432/studyling
      PORT: "4000"
    volumes:
      - .:/repo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  web:
    image: node:22
    restart: on-failure
    working_dir: /repo/client
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:5173"
    volumes:
      - .:/repo
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  db_data:
