: "1.5rem", "space-sm": "0.5rem" }, "fontFamily": { "body-sm": ["Inter"], "code": ["JetBrains Mono"], "label-sm": ["Inter"], "title-md": ["Inter"], "headline-sm": ["Plus Jakarta Sans"], "display-xl": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Plus Jakarta Sans"], "body-lg": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"], "display-xl-mobile": ["Plus Jakarta Sans"] }, "fontSize": { "body-sm": ["13px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "code": ["13px", { "lineHeight": "20px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "display-xl": ["56px", { "lineHeight": "64px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "headline-lg-mobile": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "body-lg": ["18px", { "lineHeight": "30px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-md": ["15px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "display-xl-mobile": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;background:#f9f9f9;color:#1a1c1c;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;}</style></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.02)]"><div class="h-14 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><span class="font-headline-sm text-headline-sm tracking-tight text-on-surface font-bold lowercase">studyling</span></div><div class="flex items-center gap-space-md"><div class="flex items-center gap-space-xs bg-surface-container-lowest px-2.5 py-1 rounded-full shadow-[0_1px_4px_rgba(0,0,0,0.03)]"><span class="w-1.5 h-1.5 rounded-full bg-secondary-container"></span><span class="font-code text-code text-on-surface font-medium">12</span><span class="material-symbols-outlined text-[16px] text-secondary">local_fire_department</span></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-20 bg-surface px-margin-mobile"><div class="flex flex-col w-full pb-6 pt-2">
<!-- Micro Progress Header -->
<div class="flex flex-col gap-space-sm mb-space-lg">
<div class="flex items-center justify-between">
<button aria-label="Lerneinheit beenden" class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
<div class="flex items-center gap-space-xs bg-surface-container-low px-2 py-0.5 rounded-full">
<span class="w-1.5 h-1.5 rounded-full bg-secondary-container"></span>
<span class="font-label-sm text-label-sm text-on-surface tracking-wider uppercase">Neurobiologie</span>
</div>
<span class="font-code text-code text-on-surface-variant">06<span class="text-outline-variant">/</span>10</span>
</div>
<!-- Hairline Progress Track -->
<div class="w-full h-[2px] bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-secondary-container rounded-full w-[60%] transition-all duration-300"></div>
</div>
</div>
<!-- Central Question Section -->
<div class="flex flex-col pt-space-md pb-space-lg">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant mb-space-xs">
      Aktives Erinnern
    </span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface tracking-tight leading-snug">
      Welche Funktion erfüllt die <span class="bg-secondary-container/30 px-1 py-0.5 text-on-surface">Langzeitpotenzierung (LTP)</span> im Hippocampus?
    </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-space-sm">
      Wähle die zutreffende Antwort
    </p>
</div>
<!-- Interactive Selection Options -->
<div aria-label="Antwortoptionen" class="flex flex-col gap-space-sm my-space-md" id="quiz-options" role="radiogroup">
<!-- Option A -->
<button aria-checked="false" class="option-btn text-left w-full p-space-md rounded-xl bg-surface-container-lowest hover:bg-surface-container-low transition-all duration-150 flex items-start gap-space-md group" role="radio" type="button">
<span class="status-indicator w-5 h-5 rounded-full bg-surface-container-high flex items-center justify-center shrink-0 mt-0.5 transition-colors">
<span class="font-code text-[11px] text-on-surface-variant group-hover:text-on-surface">A</span>
</span>
<span class="font-body-md text-body-md text-on-surface font-normal">
        Verringerung der Übertragungsstärke bei Dauerreiz.
      </span>
</button>
<!-- Option B (Selected / Correct State) -->
<button aria-checked="true" class="option-btn text-left w-full p-space-md rounded-xl bg-surface-container-lowest transition-all duration-150 flex items-start gap-space-md group relative shadow-sm" role="radio" type="button">
<span class="absolute left-0 top-3 bottom-3 w-1 bg-secondary-container rounded-r-full"></span>
<span class="status-indicator w-5 h-5 rounded-full bg-secondary-container text-on-secondary-fixed flex items-center justify-center shrink-0 mt-0.5 transition-colors">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">check</span>
</span>
<span class="font-body-md text-body-md text-on-surface font-medium pl-1">
        Dauerhafte Verstärkung der synaptischen Übertragung.
      </span>
</button>
<!-- Option C -->
<button aria-checked="false" class="option-btn text-left w-full p-space-md rounded-xl bg-surface-container-lowest hover:bg-surface-container-low transition-all duration-150 flex items-start gap-space-md group" role="radio" type="button">
<span class="status-indicator w-5 h-5 rounded-full bg-surface-container-high flex items-center justify-center shrink-0 mt-0.5 transition-colors">
<span class="font-code text-[11px] text-on-surface-variant group-hover:text-on-surface">C</span>
</span>
<span class="font-body-md text-body-md text-on-surface font-normal">
        Inaktivierung von Neurotransmitter-Rezeptoren.
      </span>
</button>
</div>
<!-- Floating Micro Feedback + CTA -->
<div class="mt-space-lg pt-space-md flex flex-col gap-space-md">
<!-- Feedback Pill Strip -->
<div class="flex items-center justify-between px-space-md py-space-sm bg-surface-container-lowest rounded-xl shadow-sm">
<div class="flex items-center gap-space-xs text-on-surface">
<span class="material-symbols-outlined text-[18px] text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-title-md text-title-md text-on-surface">Richtig verstanden</span>
</div>
<div class="flex items-center gap-1 bg-secondary-container/20 px-2 py-0.5 rounded-full">
<span class="font-code text-code text-secondary font-bold">+20</span>
<span class="font-label-sm text-label-sm text-secondary font-semibold">EP</span>
</div>
</div>
<!-- Minimal Next Action Button -->
<button class="w-full bg-primary hover:bg-primary-container active:scale-[0.99] text-on-primary py-3.5 px-space-lg rounded-xl flex items-center justify-center gap-space-sm transition-all duration-150 shadow-sm" id="continue-btn" type="button">
<span class="font-title-md text-title-md font-semibold text-on-primary">Weiter</span>
<span class="material-symbols-outlined text-[18px] text-on-primary">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function() {
    const options = document.querySelectorAll('.option-btn');
    options.forEach(btn => {
      btn.addEventListener('click', () => {
        options.forEach(o => {
          o.setAttribute('aria-checked', 'false');
          o.classList.remove('shadow-sm');
          const bar = o.querySelector('.absolute.left-0');
          if (bar) bar.remove();
          const ind = o.querySelector('.status-indicator');
          if (ind) {
            ind.className = 'status-indicator w-5 h-5 rounded-full bg-surface-container-high flex items-center justify-center shrink-0 mt-0.5 transition-colors';
          }
        });
        
        btn.setAttribute('aria-checked', 'true');
        btn.classList.add('shadow-sm');
        
        const accent = document.createElement('span');
        accent.className = 'absolute left-0 top-3 bottom-3 w-1 bg-secondary-container rounded-r-full';
        btn.prepend(accent);

        const activeInd = btn.querySelector('.status-indicator');
        if (activeInd) {
          activeInd.className = 'status-indicator w-5 h-5 rounded-full bg-secondary-container text-on-secondary-fixed flex items-center justify-center shrink-0 mt-0.5 transition-colors';
          activeInd.innerHTML = '<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: \'FILL\' 1;">check</span>';
        }
      });
    });
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.03)]" data-active-classes="text-on-surface [&amp;&gt;.indicator]:opacity-100"></nav>

</body></html>
