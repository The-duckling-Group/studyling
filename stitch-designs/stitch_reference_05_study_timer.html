<!-- Active Progress Arc -->

<script>
  (function initStudyTimer() {
    let durationSeconds = 25 * 60;
    let remainingSeconds = durationSeconds;
    let timerInterval = null;
    let isRunning = false;

    const circumference = 2 * Math.PI * 112; // 703.71px
    const timerDisplay = document.getElementById('timer-display');
    const timerProgress = document.getElementById('timer-progress');
    const btnPlay = document.getElementById('btn-play');
    const playIcon = document.getElementById('play-icon');
    const playText = document.getElementById('play-text');
    const btnReset = document.getElementById('btn-reset');
    const btnSkip = document.getElementById('btn-skip');
    const dndToggle = document.getElementById('dnd-toggle');
    const dndHandle = document.getElementById('dnd-handle');
    const modePills = document.querySelectorAll('.mode-pill');

    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      const progressFraction = (durationSeconds - remainingSeconds) / durationSeconds;
      const offset = circumference * (1 - progressFraction);
      timerProgress.style.strokeDashoffset = offset;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        playIcon.textContent = 'play_arrow';
        playText.textContent = 'Fortsetzen';
      } else {
        isRunning = true;
        playIcon.textContent = 'pause';
        playText.textContent = 'Pausieren';
        timerInterval = setInterval(() => {
          if (remainingSeconds > 0) {
            remainingSeconds--;
            updateDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            playIcon.textContent = 'play_arrow';
            playText.textContent = 'Neuer Zyklus';
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      remainingSeconds = durationSeconds;
      playIcon.textContent = 'play_arrow';
      playText.textContent = 'Fokus starten';
      updateDisplay();
    }

    btnPlay?.addEventListener('click', toggleTimer);
    btnReset?.addEventListener('click', resetTimer);
    btnSkip?.addEventListener('click', () => {
      resetTimer();
    });

    // Mode Selector Switching
    document.getElementById('mode-25')?.addEventListener('click', () => setMode(25, 'mode-25'));
    document.getElementById('mode-50')?.addEventListener('click', () => setMode(50, 'mode-50'));
    document.getElementById('mode-5')?.addEventListener('click', () => setMode(5, 'mode-5'));

    function setMode(mins, activeId) {
      modePills.forEach(p => {
        p.classList.remove('bg-primary', 'text-on-primary');
        p.classList.add('bg-surface-container-low', 'text-on-surface-variant');
        const dot = p.querySelector('.bg-secondary-container');
        if (dot) dot.remove();
      });

      const activeBtn = document.getElementById(activeId);
      if (activeBtn) {
        activeBtn.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
        activeBtn.classList.add('bg-primary', 'text-on-primary');
        const span = document.createElement('span');
        span.className = 'w-1.5 h-1.5 rounded-full bg-secondary-container';
        activeBtn.insertBefore(span, activeBtn.firstChild);
      }

      durationSeconds = mins * 60;
      resetTimer();
    }

    // Toggle Do Not Disturb switch
    let dndActive = true;
    dndToggle?.addEventListener('click', () => {
      dndActive = !dndActive;
      dndToggle.setAttribute('aria-checked', String(dndActive));
      if (dndActive) {
        dndToggle.classList.remove('bg-surface-container-highest');
        dndToggle.classList.add('bg-primary');
        dndHandle.classList.remove('translate-x-0');
        dndHandle.classList.add('translate-x-5');
      } else {
        dndToggle.classList.remove('bg-primary');
        dndToggle.classList.add('bg-surface-container-highest');
        dndHandle.classList.remove('translate-x-5');
        dndHandle.classList.add('translate-x-0');
      }
    });

    updateDisplay();
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.03)]" data-active-classes="text-primary font-semibold relative after:content-[''] after:absolute after:bottom-1 after:w-1 after:h-1 after:rounded-full after:bg-secondary-container"><div class="flex justify-around items-center h-16 px-space-xs"><a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-colors" data-path="pfad" href="#"><span class="material-symbols-outlined text-[22px]">route</span><span class="font-label-sm text-label-sm">Pfad</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-colors" data-path="kurse" href="#"><span class="material-symbols-outlined text-[22px]">grid_view</span><span class="font-label-sm text-label-sm">Kurse</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] min-h-[44px] transition-colors text-primary font-semibold relative after:content-[''] after:absolute after:bottom-1 after:w-1 after:h-1 after:rounded-full after:bg-secondary-container" data-path="fokus" href="#"><span class="material-symbols-outlined text-[22px]">hourglass_empty</span><span class="font-label-sm text-label-sm">Fokus</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-colors" data-path="lernen" href="#"><span class="material-symbols-outlined text-[22px]">bolt</span><span class="font-label-sm text-label-sm">Lernen</span></a></div></nav>
